name: Signal Daily release checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m compileall -q db.py server.py production.py instance.py feeds.py llm.py mailer.py config.py validation.py run.py tools tests
      - run: node --check static/app.js
      - run: node --check tools/capture_screenshots.cjs
      - run: node --check tools/acceptance_browser.cjs
      - run: python -m bandit -q -r . --exclude ./.tmp,./tests,./.venv,./data
      - run: python tools/release_audit.py
      - run: python tools/check_docs.py
      - name: Audit pinned dependencies against OSV
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python tools/audit_dependencies.py
