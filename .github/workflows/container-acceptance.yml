name: Linux container acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise actual image, volume recovery and isolated Caddy proxy
        run: python tools/container_acceptance.py
      - name: Scan the built image for operating-system and Python vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, immutable release
        with:
          image-ref: signal-daily:acceptance
          format: json
          output: .tmp/container-acceptance/image-vulnerabilities.json
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          scanners: vuln
          version: v0.70.0
      - name: Retain sanitized acceptance and image scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-container-acceptance
          path: .tmp/container-acceptance/*.json
          retention-days: 14
          if-no-files-found: error
